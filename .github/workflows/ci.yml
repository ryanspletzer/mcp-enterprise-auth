name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  # Pins the uv binary; a floating "latest" uv can change cache formats and
  # resolution behavior between runs. Bump deliberately.
  UV_VERSION: "0.11.32"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Run tests with coverage
      working-directory: ./src/mcp-server
      run: |
        uv run pytest --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./src/mcp-server/coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: src/mcp-server/junit/test-results.xml

    - name: Upload coverage report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: src/mcp-server/htmlcov/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Run flake8
      working-directory: ./src/mcp-server
      run: |
        uv run flake8 app tests --max-line-length=100 --show-source --statistics

    - name: Run mypy
      working-directory: ./src/mcp-server
      run: |
        uv run mypy app

    - name: Check formatting with black
      working-directory: ./src/mcp-server
      run: |
        uv run black --check app tests

    - name: Check import sorting with isort
      working-directory: ./src/mcp-server
      run: |
        uv run isort --check app tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Run safety check
      working-directory: ./src/mcp-server
      run: |
        uv run safety check --json || true

    - name: Run bandit security scan
      working-directory: ./src/mcp-server
      run: |
        uv run bandit -r app -f json -o bandit-report.json || true

    - name: Upload bandit report
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: bandit-report
        path: src/mcp-server/bandit-report.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Build Docker image
      working-directory: ./src/mcp-server
      run: |
        docker build -t mcp-server:test .

    - name: Test Docker image
      # Dummy values for the settings fields that have no defaults —
      # this smoke test only proves the app factory runs inside the image.
      run: |
        docker run --rm \
          -e ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
          -e MCP_SERVER_APP_ID=api://mcp-server \
          -e REQUIRED_SCOPE=mcp.read \
          -e REQUIRED_ROLE=MCP.ReadWrite.All \
          -e VSCODE_CLIENT_ID=11111111-1111-1111-1111-111111111111 \
          -e CLAUDE_DESKTOP_CLIENT_ID=22222222-2222-2222-2222-222222222222 \
          -e CLAUDE_CODE_CLIENT_ID=33333333-3333-3333-3333-333333333333 \
          -e CHATGPT_CLIENT_ID=44444444-4444-4444-4444-444444444444 \
          -e GENERIC_CLIENT_ID=55555555-5555-5555-5555-555555555555 \
          mcp-server:test python -c "from app.main import create_app; app = create_app(); print('✓ App created successfully')"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Start Redis (for integration tests)
      run: |
        docker run -d -p 6379:6379 redis:7-alpine

    - name: Run integration tests
      working-directory: ./src/mcp-server
      run: |
        uv run pytest -m integration -v

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker, integration-test]
    if: always()

    steps:
    - name: Check job results
      run: |
        if [[ "${{ needs.test.result }}" == "success" ]] && \
           [[ "${{ needs.lint.result }}" == "success" ]] && \
           [[ "${{ needs.security.result }}" == "success" ]] && \
           [[ "${{ needs.docker.result }}" == "success" ]] && \
           [[ "${{ needs.integration-test.result }}" == "success" ]]; then
          echo "✓ All checks passed!"
          exit 0
        else
          echo "✗ Some checks failed"
          exit 1
        fi
