name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('src/mcp-server/pyproject.toml', 'src/mcp-server/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Run tests with coverage
      working-directory: ./src/mcp-server
      run: |
        uv run pytest --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./src/mcp-server/coverage.xml
        flags: unittests
        name: codecov-umbrella

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: src/mcp-server/junit/test-results.xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: src/mcp-server/htmlcov/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Run flake8
      working-directory: ./src/mcp-server
      run: |
        uv run flake8 app tests --max-line-length=100 --show-source --statistics

    - name: Run mypy
      working-directory: ./src/mcp-server
      run: |
        uv run mypy app

    - name: Check formatting with black
      working-directory: ./src/mcp-server
      run: |
        uv run black --check app tests

    - name: Check import sorting with isort
      working-directory: ./src/mcp-server
      run: |
        uv run isort --check app tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Run safety check
      working-directory: ./src/mcp-server
      run: |
        uv run safety check --json || true

    - name: Run bandit security scan
      working-directory: ./src/mcp-server
      run: |
        uv run bandit -r app -f json -o bandit-report.json || true

    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: src/mcp-server/bandit-report.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      working-directory: ./src/mcp-server
      run: |
        docker build -t mcp-server:test .

    - name: Test Docker image
      run: |
        docker run --rm mcp-server:test python -c "from app.main import create_app; app = create_app(); print('✓ App created successfully')"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      working-directory: ./src/mcp-server
      run: |
        uv sync --extra dev

    - name: Start Redis (for integration tests)
      run: |
        docker run -d -p 6379:6379 redis:7-alpine

    - name: Run integration tests
      working-directory: ./src/mcp-server
      run: |
        uv run pytest -m integration -v

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker, integration-test]
    if: always()

    steps:
    - name: Check job results
      run: |
        if [[ "${{ needs.test.result }}" == "success" ]] && \
           [[ "${{ needs.lint.result }}" == "success" ]] && \
           [[ "${{ needs.docker.result }}" == "success" ]] && \
           [[ "${{ needs.integration-test.result }}" == "success" ]]; then
          echo "✓ All checks passed!"
          exit 0
        else
          echo "✗ Some checks failed"
          exit 1
        fi
