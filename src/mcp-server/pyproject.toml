[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server with Proper Enterprise Authentication via Entra ID"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "redis>=8.0.1",
    "hiredis>=3.4.1",
    "cachetools>=5.3.2",
    "mcp>=2.1.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.10",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
aws = ["aws-xray-sdk>=2.12.1"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-watch>=4.2.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.15.1",
    "faker>=40.36.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0.20241004",
    "types-cachetools>=7.0.0.20260713",
    "black>=26.5.1",
    "isort>=5.13.2",
    "flake8>=7.3.0",
    "safety>=3.8.1",
    "bandit>=1.7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
# Must match requires-python: with only py314 listed, black emits
# 3.14-only syntax (e.g. PEP 758 unparenthesized except tuples).
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_optional = true

# python-jose has no type stubs published; scope the ignore to that
# package only rather than a blanket ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"

# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = [
    "-v",
    # Show summary of all test outcomes
    "-ra",
    # Show local variables in tracebacks
    "-l",
    # Fail on unknown markers
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    # Show slowest tests
    "--durations=10",
]

markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may require external services)",
    "slow: Slow tests (may take >1s)",
    "security: Security-related tests",
    "jwt: JWT validation tests",
    "dcr: DCR emulation tests",
    "auth: Authentication tests",
    "api: API endpoint tests",
    "mcp: MCP protocol tests",
]

asyncio_mode = "auto"

# coverage.py never reads pytest.ini, so these must live here (or in
# .coveragerc / setup.cfg / tox.ini) to have any effect at all.
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    # Don't complain about missing debug-only code
    "def __repr__",
    # Don't complain if tests don't hit defensive assertion code
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    # Don't complain about ellipsis in protocols
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-watch>=4.2.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.15.1",
    "faker>=40.36.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0.20241004",
    "types-cachetools>=7.0.0.20260713",
    "black>=26.5.1",
    "isort>=5.13.2",
    "flake8>=7.3.0",
    "safety>=3.8.1",
    "bandit>=1.7.6",
    "ruff>=0.16.4",
]
