[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server with Proper Enterprise Authentication via Entra ID"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "httpx>=0.28.1",
    "aiohttp>=3.9.1",
    "redis>=8.0.1",
    "hiredis>=3.4.0",
    "cachetools>=5.3.2",
    "mcp>=0.9.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.10",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
aws = ["aws-xray-sdk>=2.12.1"]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-watch>=4.2.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.15.1",
    "faker>=40.35.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0.20241004",
    "types-cachetools>=5.3.0.7",
    "black>=24.1.1",
    "isort>=5.13.2",
    "flake8>=7.3.0",
    "safety>=3.0.1",
    "bandit>=1.7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
# Must match requires-python: with only py314 listed, black emits
# 3.14-only syntax (e.g. PEP 758 unparenthesized except tuples).
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_optional = true

# python-jose has no type stubs published; scope the ignore to that
# package only rather than a blanket ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-watch>=4.2.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.15.1",
    "faker>=40.35.0",
    "mypy>=1.8.0",
    "types-redis>=4.6.0.20241004",
    "types-cachetools>=5.3.0.7",
    "black>=24.1.1",
    "isort>=5.13.2",
    "flake8>=7.3.0",
    "safety>=3.0.1",
    "bandit>=1.7.6",
    "ruff>=0.4.0",
]
