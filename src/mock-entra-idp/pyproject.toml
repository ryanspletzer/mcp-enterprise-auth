[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-entra-idp"
version = "0.1.0"
description = "Mock Entra ID OAuth 2.0/OIDC token issuer for testing and demos"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MCP Team"}
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=42.0.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
    "structlog>=24.1.0",
    "redis>=8.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-playwright>=0.8.0",
    "playwright>=1.49.0",
    "httpx>=0.26.0",
    "faker>=22.2.0",
    "black>=24.1.1",
    "isort>=8.0.1",
    "mypy>=2.3.0",
    "types-python-jose>=3.3.0",
    "ruff>=0.16.0",
]

[tool.black]
line-length = 100
# Keep the requires-python floor (3.11) in this list: a py314-only target
# would let black emit PEP 758 paren-less `except` syntax that older
# supported interpreters can't parse.
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests with browser",
]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]

[tool.mypy]
# Check against the requires-python floor, not the newest interpreter
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
