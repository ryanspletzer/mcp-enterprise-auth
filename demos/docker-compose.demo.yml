version: '3.8'

services:
  mock-idp:
    build:
      context: ../mock-entra-idp
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - MOCK_TENANT_ID=12345678-1234-1234-1234-123456789abc
      - MOCK_IDP_PORT=8001
      - MOCK_IDP_BASE_URL=http://mock-idp:8001
      - MCP_SERVER_APP_ID=api://mcp-server
      - LOG_LEVEL=INFO
      - ACCESS_TOKEN_TTL=3600
      - REFRESH_TOKEN_TTL=86400
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Point to mock IdP instead of real Entra ID
      - ENTRA_TENANT_ID=12345678-1234-1234-1234-123456789abc
      - ENTRA_AUTHORITY=http://mock-idp:8001
      - ENTRA_JWKS_URL=http://mock-idp:8001/discovery/v2.0/keys
      - MCP_SERVER_APP_ID=api://mcp-server
      - MCP_SERVER_SCOPE_PREFIX=api://mcp-server
      - REQUIRED_SCOPE=api://mcp-server/.default
      - REQUIRED_ROLE=MCP.ReadWrite.All
      - DEBUG_MODE=true
      - ENABLE_SWAGGER=true
      - ENABLE_DCR_ENDPOINT=true
      # Use known client IDs from mock IdP
      - VSCODE_CLIENT_ID=11111111-1111-1111-1111-111111111111
      - CLAUDE_CODE_CLIENT_ID=33333333-3333-3333-3333-333333333333
      - CLAUDE_DESKTOP_CLIENT_ID=22222222-2222-2222-2222-222222222222
      - CHATGPT_CLIENT_ID=44444444-4444-4444-4444-444444444444
      - GENERIC_CLIENT_ID=55555555-5555-5555-5555-555555555555
    depends_on:
      mock-idp:
        condition: service_healthy
    networks:
      - demo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  demo-network:
    driver: bridge
