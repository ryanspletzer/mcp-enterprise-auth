[pytest]
# Pytest configuration for MCP client tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (with mocked HTTP calls)
    asyncio: Async tests
    slow: Slow tests (manual or interactive)

# Output settings
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Async settings
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = .
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
